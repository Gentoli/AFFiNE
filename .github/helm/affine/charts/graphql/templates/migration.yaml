apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "graphql.fullname" . }}-database-migration
  labels:
    {{- include "graphql.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation

spec:
  template:
    spec:
      serviceAccountName: {{ include "graphql.serviceAccountName" . }}
      initContainers:
        - name: empty-file
          image: alpine
          command: ["sh", "-c", "touch /mnt/schema.gql"]
          volumeMounts:
          - name: config
            mountPath: /mnt
      {{- with .Values.global.database.gcloud }}
      {{- if .enabled }}
        - name: wait-for-cloud-sql-proxy
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              until wget -q -T 2 -O /dev/null "http://{{ $.Values.global.database.host }}:9801/startup"; do
                echo "waiting for cloud sql proxy to become ready"
                sleep 2
              done
      {{- end }}
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: Always
        command: ["yarn", "predeploy"]
        env:
          - name: NODE_ENV
            value: "{{ .Values.env }}"
          - name: AFFINE_ENV
            value: "{{ .Values.env }}"
          - name: DEPLOYMENT_TYPE
            value: "{{ .Values.global.deployment.type }}"
          - name: DEPLOYMENT_PLATFORM
            value: "{{ .Values.global.deployment.platform }}"
          - name: DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ default (print (include "graphql.fullname" .) "-pg" ) .Values.global.database.secret.name }}
                key: {{ .Values.global.database.secret.key }}
          - name: DATABASE_URL
            value: postgres://{{ .Values.global.database.user }}:$(DATABASE_PASSWORD)@{{ .Values.global.database.host }}:{{ .Values.global.database.port }}/{{ .Values.global.database.name }}
          - name: REDIS_SERVER_HOST
            value: "{{ .Values.global.redis.host }}"
          - name: REDIS_SERVER_PORT
            value: "{{ .Values.global.redis.port }}"
          - name: REDIS_SERVER_USER
            value: "{{ .Values.global.redis.username }}"
          {{- if or .Values.global.redis.secret.name .Values.global.redis.secret.password }}
          - name: REDIS_SERVER_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ default "redis-password" .Values.global.redis.secret.name }}
                key: {{ .Values.global.redis.secret.key }}
          {{- end }}
        resources:
          requests:
            cpu: '100m'
            memory: '200Mi'
        volumeMounts:
          - name: config
            mountPath: {{ .Values.app.config.path }}
            subPath: .affine
          - name: config
            mountPath: /app/dist/schema.gql
            subPath: schema.gql
          - name: indexer-config
            mountPath: /app/config.json
            subPath: config.json
            readOnly: true
      volumes:
        - name: config
          {{- if .Values.app.config.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "graphql.fullname" . }}-config
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: indexer-config
          secret:
            secretName: indexer
      restartPolicy: Never
  backoffLimit: 1
